[project]
name = "tk-data-ctd"
version = "0.1.0"
description = "CLI for investigating the CTD Commons / EMA regulatory document collection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "simple-parsing>=0.1.9",
]

[project.scripts]
ctd = "tk.data.ctd.__main__:main"

[project.optional-dependencies]
analysis = [
    "pyreadstat>=1.2",
    "lxml>=5",
    "pdfplumber>=0.11",
]
docs = [
    "markitdown>=0.0.1",
]
huggingface = [
    "datasets>=3.0",
]
ui = [
    "gradio>=4.40",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk"]
